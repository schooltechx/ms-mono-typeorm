# for debug build use
# docker compose build --no-cache migration-service --progress=plain
services:
  migration-service:
    image: ms-mono-typeorm/migration-service:latest
    volumes:
      - ./data:/data 
  product-service:
    image: ms-mono-typeorm/product-service:latest
    ports:
      - "3002:80"
    volumes:
      - ./data:/data 

  order-service:
    image: ms-mono-typeorm/order-service:latest
    volumes:
      - ./data:/data 


  conops:
    image: anurag1201/conops:latest
    ports:
      - "8080:8080"
    environment:
      - CONOPS_RUNTIME_DIR=/tmp/conops-runtime
      - DB_TYPE=sqlite
    volumes:
      # Persist SQLite DB and encryption keys
      - ./data_conops:/data
      # Allow ConOps to manage sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Runtime directory for checkouts
      - /tmp/conops-runtime:/tmp/conops-runtime
