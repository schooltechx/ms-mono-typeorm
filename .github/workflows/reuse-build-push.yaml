# act --workflows .github/workflows/build-push-services.yaml --input TAG=1.0  --host ms-mono-typeorm.local:192.168.2.49

name: Reusable build and push
on:
  workflow_call:
    inputs:
      TAG:
        required: true
        type: string
      SERVICE_NAME:
        required: true
        type: string        
      REGISTRY_BASE:
        required: false
        type: string
        default: "ms-mono-typeorm.local/demo"

jobs:
  build-docker:
    steps:
      - name: Build and push service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{inputs.SERVICE_NAME}}/Dockerfile
          push: true # Push the image to the registry if build succeeds
          tags: | 
            ${{inputs.REGISTRY_BASE}}/${{inputs.SERVICE_NAME}}:${{inputs.TAG}}
            ${{inputs.REGISTRY_BASE}}/${{inputs.SERVICE_NAME}}:latest
          # cache-from: type=gha, scope=${{ runner.os }}-buildx
          # cache-to: type=gha, scope=${{ runner.os }}-buildx, mode=max

## push to registry if needed
