# act --workflows .github/workflows/build-push-services.yaml -j build-push-services --input TAG=1.0 -s GH_TOKEN=xxxx
name: Build and Push Services

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: "tag for the image"
        type: string
      REPO:
        required: false
        type: string
        default: "schooltechx/ms-mono-typeorm"

jobs:
  build-push-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: "schooltechx/ms-mono-typeorm"
          ref: "main"
          token: ${{secrets.GH_TOKEN}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push migration-service image
        uses: .github/workflows/reuse-build-push.yaml@main
        with:
          TAG: ${{github.event.inputs.TAG}}
          SERVICE_NAME: "migration-service"
