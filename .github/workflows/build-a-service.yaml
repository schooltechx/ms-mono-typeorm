# act --workflows .github/workflows/build-a-service.yaml -j build-docker --input NAME=migration-service
name: Build a Service

on:
  workflow_dispatch:
    inputs:
      NAME:
        description: "service name, e.g. migration-service, product-service, order-service"
        type: string

env:
  SERVICE_FOLDER: services/${{github.event.inputs.NAME}}
  IMAGE_NAME: ms-mono-typeorm/${{github.event.inputs.NAME}}
  IMAGE_TAG: latest

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          # fetch-depth: 0
          sparse-checkout: |
            packages
            services/${{env.SERVICE_FOLDER}}
      - run: |
          ls -la . packages 
      - run: |
          docker build -t ${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}} -f ${{env.SERVICE_FOLDER}}/Dockerfile .
## push to registry if needed
